<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
    <meta name="theme-color" content="#f7f7f2">
    <meta name="mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-title" content="Yachtie Radio">
    <meta name="apple-mobile-web-app-status-bar-style" content="default">
    <meta name="format-detection" content="telephone=no">
    <title>Yachtie Radio</title>
    <link rel="manifest" href="/manifest.webmanifest">
    <link rel="icon" href="/icon.svg" type="image/svg+xml">
    <link rel="stylesheet" href="/styles.css?v=mobile-friendly">
    <script src="/app.js?v=mobile-friendly" defer></script>
  </head>
  <body>
    <main class="shell">
      <section class="masthead" aria-labelledby="app-title">
        <img class="brand-mark" src="/icon.svg" alt="">
        <div>
          <p class="eyebrow">LAN PTT</p>
          <h1 id="app-title">Yachtie Radio</h1>
        </div>
      </section>

      <section class="network-band" aria-label="Network setup">
        <div class="network-copy">
          <p class="eyebrow">Wi-Fi First</p>
          <h2>Same yacht Wi-Fi</h2>
          <p id="networkDetail" class="network-detail">Internet is optional. Crew devices just need this Wi-Fi and the local radio address.</p>
        </div>
        <div id="networkPanel" class="network-panel">
          <div class="network-status">
            <span class="status-dot" aria-hidden="true"></span>
            <span id="networkStatus">Checking radio server</span>
          </div>
          <div class="address-row">
            <code id="networkAddress">Local radio address</code>
            <button id="copyAddressButton" class="button small" type="button">Copy</button>
          </div>
        </div>
      </section>

      <section class="control-band" aria-label="Radio channel">
        <label class="field">
          <span>Name</span>
          <input id="nameInput" autocomplete="nickname" enterkeyhint="done" maxlength="40" placeholder="Deckhand" spellcheck="false">
        </label>
        <label class="field">
          <span>Radio Channel</span>
          <input id="roomInput" autocapitalize="none" autocomplete="off" enterkeyhint="done" maxlength="32" placeholder="deck" spellcheck="false">
        </label>
        <button id="joinButton" class="button primary" type="button" disabled>Join Channel</button>
        <button id="leaveButton" class="button ghost" type="button" disabled>Leave</button>
      </section>

      <section class="radio-face" aria-label="Push to talk">
        <div class="status-row">
          <div>
            <p class="label">Status</p>
            <p id="statusText" class="status-text">Offline</p>
          </div>
          <div class="signal-pill" id="signalPill">LAN</div>
        </div>

        <button id="talkButton" class="talk-button" type="button" disabled aria-pressed="false">
          <span class="tx-light" aria-hidden="true"></span>
          <span id="talkButtonText">Hold to Talk</span>
        </button>

        <div class="meter" aria-hidden="true">
          <span></span>
          <span></span>
          <span></span>
          <span></span>
          <span></span>
          <span></span>
          <span></span>
        </div>
      </section>

      <section class="crew-band" aria-labelledby="crew-title">
        <div class="section-heading">
          <h2 id="crew-title">Crew Online</h2>
          <span id="peerCount">0 peers</span>
        </div>
        <div id="peerList" class="peer-list" aria-live="polite"></div>
      </section>

      <section class="log-band" aria-labelledby="log-title">
        <h2 id="log-title">Signal Log</h2>
        <ol id="eventLog" class="event-log"></ol>
      </section>

      <div id="remoteAudio" class="remote-audio" aria-hidden="true"></div>
    </main>
  </body>
</html>
